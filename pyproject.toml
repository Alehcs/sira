[project]
name = "sira"
version = "0.1.0"
description = "An AI astronomer built to be proven wrong in public."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "astropy>=6.0",
    "httpx>=0.27",
    "iminuit>=2.33.0",
    "numpy>=1.26",
    "openai>=1.50",
    "opentimestamps-client>=0.7.2",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "scipy>=1.18.1",
    "sncosmo>=2.13.1",
]

[project.scripts]
sira = "sira.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
