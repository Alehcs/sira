name: nightly

on:
  schedule:
    - cron: "0 21 * * *"  # 18:00 in Chile, hours before night falls at Palomar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  bets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Check out the ledger branch
        run: |
          git fetch origin ledger
          git worktree add ledger origin/ledger
      - name: Score open bets, place new ones, anchor
        run: uv run sira live --ledger ledger
      - name: Verify the whole ledger
        run: uv run sira verify --ledger ledger
      - name: Publish
        working-directory: ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.jsonl receipts
          git commit -m "Ledger for $(date -u +%F)" || exit 0
          git push origin HEAD:ledger
