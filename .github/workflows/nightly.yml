name: nightly

on:
  schedule:
    - cron: "0 21 * * *"  # 18:00 in Chile, hours before night falls at Palomar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  bets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Check out the ledger branch
        run: |
          git fetch origin ledger
          git worktree add ledger origin/ledger
      - name: Verify the ledger before adding to it
        run: uv run sira verify --ledger ledger
      - name: Score open bets, place new ones, anchor
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
        run: uv run sira live --ledger ledger --team --night-usd 4
      - name: Verify again, against the archive
        run: uv run sira verify --ledger ledger --online
      - name: Publish
        # sealed bets go public even when a check fails, so the failure is public too
        if: always()
        working-directory: ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ledger.jsonl receipts 2>/dev/null || exit 0
          git commit -m "Ledger for $(date -u +%F)" || exit 0
          git push origin HEAD:ledger
